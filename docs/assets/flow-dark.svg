<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="1. The shopper clicks Split with Maytes. 2. Your server creates the checkout. 3. The shopper pays their share on Maytes. 4. Maytes sends a webhook and your server captures."><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect x="4.0" y="8" width="196" height="176" rx="16" fill="#161B22" stroke="#30363D"/><circle cx="38.0" cy="44" r="18" fill="#FE572A"/><text x="38.0" y="50.5" font-size="17" font-weight="800" fill="#191919" text-anchor="middle">1</text><text x="20.0" y="94" font-size="15.5" font-weight="700" fill="#E6EDF3" text-anchor="start"><tspan x="20.0" dy="0.0">Shopper clicks</tspan><tspan x="20.0" dy="20.9">Split with Maytes</tspan></text><text x="20.0" y="144" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start"><tspan x="20.0" dy="0.0">The button calls your</tspan><tspan x="20.0" dy="16.9">createCheckout()</tspan></text><path d="M203.0 96 h17.33 m-6 -6 l6 6 l-6 6" fill="none" stroke="#E8F951" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20.0" y="198" width="96" height="26" rx="13" fill="#4A0324"/><text x="68.0" y="215.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">The button</text><rect x="225.32999999999998" y="8" width="196" height="176" rx="16" fill="#161B22" stroke="#30363D"/><circle cx="259.33" cy="44" r="18" fill="#E8F951"/><text x="259.33" y="50.5" font-size="17" font-weight="800" fill="#191919" text-anchor="middle">2</text><text x="241.32999999999998" y="94" font-size="15.5" font-weight="700" fill="#E6EDF3" text-anchor="start"><tspan x="241.32999999999998" dy="0.0">Your server creates</tspan><tspan x="241.32999999999998" dy="20.9">the checkout</tspan></text><text x="241.32999999999998" y="144" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start"><tspan x="241.32999999999998" dy="0.0">With your API keys. Returns</tspan><tspan x="241.32999999999998" dy="16.9">checkoutId + checkoutUrl</tspan></text><path d="M424.33 96 h17.33 m-6 -6 l6 6 l-6 6" fill="none" stroke="#E8F951" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.07999999999998" y="198.75" width="96" height="24.5" rx="12.25" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/><text x="290.08" y="215.5" font-size="12.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Your server</text><rect x="446.65999999999997" y="8" width="196" height="176" rx="16" fill="#161B22" stroke="#30363D"/><circle cx="480.65999999999997" cy="44" r="18" fill="#67D6FE"/><text x="480.65999999999997" y="50.5" font-size="17" font-weight="800" fill="#191919" text-anchor="middle">3</text><text x="462.65999999999997" y="94" font-size="15.5" font-weight="700" fill="#E6EDF3" text-anchor="start"><tspan x="462.65999999999997" dy="0.0">Shopper pays their</tspan><tspan x="462.65999999999997" dy="20.9">share on Maytes</tspan></text><text x="462.65999999999997" y="144" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start"><tspan x="462.65999999999997" dy="0.0">Popup on desktop,</tspan><tspan x="462.65999999999997" dy="16.9">same tab on phones</tspan></text><path d="M645.66 96 h17.33 m-6 -6 l6 6 l-6 6" fill="none" stroke="#E8F951" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="462.65999999999997" y="198" width="96" height="26" rx="13" fill="#4A0324"/><text x="510.65999999999997" y="215.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">The button</text><rect x="667.99" y="8" width="196" height="176" rx="16" fill="#161B22" stroke="#30363D"/><circle cx="701.99" cy="44" r="18" fill="#CB80FA"/><text x="701.99" y="50.5" font-size="17" font-weight="800" fill="#191919" text-anchor="middle">4</text><text x="683.99" y="94" font-size="15.5" font-weight="700" fill="#E6EDF3" text-anchor="start"><tspan x="683.99" dy="0.0">Webhook, then</tspan><tspan x="683.99" 